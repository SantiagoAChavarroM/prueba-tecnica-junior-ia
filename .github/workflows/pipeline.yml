name: Pipeline de correos

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub puede retrasarlo algunos minutos)
  workflow_dispatch:          # ejecución manual desde la pestaña Actions

concurrency:
  group: pipeline            # nunca dos ejecuciones a la vez (evita condiciones de carrera)
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline (Gmail -> Supabase)
        env:
          AUTHORIZED_SENDER: ${{ secrets.AUTHORIZED_SENDER }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_EXTRA_QUERY: ${{ vars.GMAIL_EXTRA_QUERY || 'newer_than:30d' }}
          GMAIL_SUBJECT_FILTER: ${{ vars.GMAIL_SUBJECT_FILTER || 'Reporte operacional' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.5-flash-lite,gemini-3.5-flash' }}
        run: python -m src.pipeline --source gmail
